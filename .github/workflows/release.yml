name: Release

# The family's standard release: a pushed v<version> tag is checked, packed, attached to the
# GitHub Release and published to npm through trusted publishing (OIDC). No npm token is stored.
#
# npmjs.com side (package Settings -> Trusted publisher) must name:
#   Organization or user  kubohiroya
#   Repository            turbowarp-kamishibai-app
#   Workflow filename     release.yml   <- the filename alone
#   Environment           (empty)
on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  # Serialize different tags as well: npm publish itself mutates a dist-tag.
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
        # No registry-url: it writes an .npmrc with a placeholder token, and npm sends a configured
        # token instead of exchanging the workflow identity, so publishing fails with
        # "OIDC permission denied".
      - run: pnpm install --frozen-lockfile
      # The release pull request's CI already ran the full release validation (verify:full) on
      # its merge result and recorded that tree. When the tag's tree is the same, repeating the
      # same checks here only delays the release. Any other tree runs the full validation.
      - name: Find the full validation of this exact tree
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          run=''
          for pr in $(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].number'); do
            head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)"
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" --jq '.workflow_runs[].id'); do
              artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.name == "verified-full-tree" and (.expired | not))][0].id // empty')"
              [ -n "$artifact" ] || continue
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/verified.zip"
              if [ "$(unzip -p "$RUNNER_TEMP/verified.zip" tree.txt | tr -d '[:space:]')" = "$tree" ]; then
                run="$id"
                break 2
              fi
            done
          done
          if [ -n "$run" ]; then
            echo "Tree $tree passed the full validation in CI run $run (pull request #$pr)."
          else
            echo "No full validation of tree $tree was found; running it here."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Run the full release validation
        if: ${{ steps.verified.outputs.run == '' }}
        run: pnpm run check
        env:
          KAMISHIBAI_RELEASE_CHECK: '1'
      - name: Check the tag names the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not name package.json version $version."
            exit 1
          fi
      - name: Require the release commit to remain the published main
        # One guard for every job: the tag must still name the release commit, and main may only
        # have advanced by commits that no publication step reads (docs/).
        run: node scripts/assert-current-release.ts
      - name: Rebuild and verify the frozen Standard SB3
        run: |
          pnpm run build:lib
          node scripts/sb3/dsl4-published-assets.ts stage "$RUNNER_TEMP/dsl4-release"
          git diff --exit-code
      - name: Pack the npm archive
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/npm" > "$RUNNER_TEMP/pack.json"
          file="$(node -p "const r = require(process.env.RUNNER_TEMP + '/pack.json'); (Array.isArray(r) ? r[0] : Object.values(r)[0]).filename")"
          echo "file=$RUNNER_TEMP/npm/$file" >> "$GITHUB_OUTPUT"
      - name: Attach to the GitHub Release
        # An attachment that already exists must be byte-identical: a release driver may have
        # uploaded its locally verified archive first, and a differing CI build stops here,
        # before anything reaches npm.
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_ARCHIVE: ${{ steps.pack.outputs.file }}
        run: |
          set -euo pipefail
          node scripts/assert-current-release.ts
          tag="$GITHUB_REF_NAME"
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            prerelease=()
            case "$version" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$tag" --verify-tag --title "$name $version" --generate-notes "${prerelease[@]}" ||
              gh release view "$tag" > /dev/null
          fi
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | "\(.name)\t\(.digest)"')"
          shopt -s nullglob
          for file in "$NPM_ARCHIVE" "$RUNNER_TEMP/dsl4-release/kamishibai-$version.sb3"; do
            want="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            have="$(printf '%s\n' "$existing" | awk -F'\t' -v n="$(basename "$file")" '$1 == n { print $2 }')"
            if [ -z "$have" ]; then
              gh release upload "$tag" "$file"
            elif [ "$have" != "$want" ]; then
              echo "::error::$(basename "$file") is already attached with different content."
              exit 1
            fi
          done

  # The site lists the current release from its verified publication record, which the npm job
  # attaches to the GitHub Release as its last step. So the site job waits for the npm job; run
  # side by side, the site build found no record and failed (v4.0.4).
  npm:
    needs: release
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Take the archive attached by the release job
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          file="$(node -p "'$name'.replace(/^@/, '').replace('/', '-')")-$version.tgz"
          mkdir -p "$RUNNER_TEMP/npm"
          gh release download "$GITHUB_REF_NAME" --pattern "$file" --dir "$RUNNER_TEMP/npm"
          want="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq ".assets[] | select(.name == \"$file\") | .digest")"
          test "sha256:$(sha256sum "$RUNNER_TEMP/npm/$file" | cut -d' ' -f1)" = "$want"
          echo "file=$RUNNER_TEMP/npm/$file" >> "$GITHUB_OUTPUT"
      - name: Stage the frozen Standard SB3 for the publication record
        run: |
          pnpm run build:lib
          node scripts/sb3/dsl4-published-assets.ts stage "$RUNNER_TEMP/dsl4-release"
          git diff --exit-code
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.21.0
      - name: Publish to npm
        # Last step: a failed check or mismatched tag stops the release before the registry,
        # where a version cannot be replaced.
        env:
          NPM_ARCHIVE: ${{ steps.pack.outputs.file }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          node scripts/assert-current-release.ts
          want="$(sha1sum "$NPM_ARCHIVE" | cut -d' ' -f1)"
          have="$(npm view "$name@$version" dist.shasum --prefer-online 2> /dev/null || true)"
          if [ -n "$have" ]; then
            if [ "$have" != "$want" ]; then
              echo "::error::$name@$version is already published with different content."
              exit 1
            fi
            echo "$name@$version is already published with this archive."
          else
            dist_tag="$(node -p "require('./package.json').publishConfig?.tag ?? ''")"
            if [ -z "$dist_tag" ]; then
              case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
            fi
            npm publish "$NPM_ARCHIVE" --access public --provenance --tag "$dist_tag"
          fi
          # Accepting a publish and serving it differ; wait for the registry itself.
          for attempt in $(seq 1 60); do
            have="$(npm view "$name@$version" dist.shasum --prefer-online 2> /dev/null || true)"
            [ -n "$have" ] && break
            sleep 10
          done
          if [ "$have" != "$want" ]; then
            echo "::error::The registry does not serve $name@$version with the packed archive."
            exit 1
          fi
      - name: Point latest and next at this release
        # The family keeps both dist-tags on the newest verified release
        # (kubohiroya/turbowarp-plus-packages#16).
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          node scripts/finalize-release-tags.ts "$name" "$version"
      - name: Attach the verified publication record without changing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/sb3/dsl4-published-assets.ts record "$RUNNER_TEMP/dsl4-release"
          file="$RUNNER_TEMP/dsl4-release/kamishibai-$version.release-metadata.json"
          want="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets[] | "\(.name)\t\(.digest)"')"
          have="$(printf '%s\n' "$existing" | awk -F'\t' -v n="$(basename "$file")" '$1 == n { print $2 }')"
          if [ -z "$have" ]; then
            gh release upload "$GITHUB_REF_NAME" "$file"
          elif [ "$have" != "$want" ]; then
            echo "::error::The publication record already exists with different bytes."
            exit 1
          fi
          git diff --exit-code

  site:
    needs: [release, npm]
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:lib
      - name: Publish the verified current release site with history retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/assert-current-release.ts
          pnpm run build:site
          git diff --exit-code
          node scripts/assert-current-release.ts
          node --input-type=module <<'NODE'
          import {deploySite} from './scripts/deploy-site.ts';
          const repo = `https://x-access-token:${process.env.GH_TOKEN}@github.com/${process.env.GITHUB_REPOSITORY}.git`;
          await deploySite('site-dist', {repo, message: `Publish verified release ${process.env.GITHUB_SHA}`, user: {name: 'github-actions[bot]', email: '41898282+github-actions[bot]@users.noreply.github.com'}});
          NODE
          pages_commit="$(git ls-remote origin refs/heads/gh-pages | cut -f1)"
          node scripts/request-pages-build.ts "$pages_commit"
