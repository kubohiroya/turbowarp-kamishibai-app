packages:
  - .

allowBuilds:
  core-js: false
  es5-ext: false
  esbuild: true
  fsevents: false

# Keep the 24-hour guard for external dependencies. Only these family packages are exempt.
minimumReleaseAgeExclude:
  - '@kubohiroya/turbowarp-sb3-save-format'
  - '@kubohiroya/turbowarp-named-data'
  - '@kubohiroya/vite-plugin-turbowarp-extension'
  - '@kubohiroya/turbowarp-kamishibai-site-navigation'
  - '@kubohiroya/sb3-toolchain'
  - '@kubohiroya/turbowarp-teachable-machine'
  - '@kubohiroya/turbowarp-svg-text'
  - '@kubohiroya/turbowarp-runtime-expression'
  - '@kubohiroya/turbowarp-runtime-adapter'
  - '@kubohiroya/turbowarp-local-preview'
  - '@kubohiroya/turbowarp-live-reload-controller'
  - '@kubohiroya/turbowarp-kvs'
  - '@kubohiroya/turbowarp-extension-manifest'
  - '@kubohiroya/turbowarp-camera-source'
  - '@kubohiroya/turbowarp-bubble'
  - '@kubohiroya/turbowarp-async-input'
  - '@kubohiroya/turbowarp-asset-cache'
  - '@kubohiroya/turbowarp-app-shell'
  - '@kubohiroya/turbowarp-document-data'
  - '@kubohiroya/turbowarp-yaml-json'
  - '@kubohiroya/turbowarp-extension-loader'
  - '@kubohiroya/turbowarp-document-source'

overrides:
  'scratch-vm>scratch-parser': 6.0.0
  'scratch-vm>uuid': 11.1.1
  'scratch-vm>worker-loader': '-'

peerDependencyRules:
  allowedVersions:
    scratch-render-fonts: 1.0.0
